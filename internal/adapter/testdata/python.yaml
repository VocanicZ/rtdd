# The Python adapter on contract v3.
# name/detect: which repos this adapter claims.
# unit_cmd: one test file per process under pytest-cov. --cov-report writes the lcov rtdd reads.
# env: COVERAGE_FILE keeps parallel units off each other's .coverage.
# coverage_file/coverage_format: where that lcov lands and how to parse it.
# exit_codes: pytest exits that mean "unit had nothing to run", not "failed".
# requires: binaries doctor checks for.
# test_globs: a unit must be a file pytest can run on its own (no tests/__init__.py or helpers).
# source_globs/opaque/full_escalate: what counts as source, what coverage cannot see into,
# and which changes force the whole suite.
name: python
detect: ["pytest.ini", "pyproject.toml", "setup.cfg"]
unit_cmd: "pytest -q -p no:cacheprovider --cov=. --cov-report=lcov:{tmp}/lcov.info {unit}"
env: { COVERAGE_FILE: "{tmp}/.coverage" }
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
exit_codes: { 4: bad-selector, 5: no-tests-collected }
requires:
  - bin: pytest
    reason: "the python adapter runs pytest with the pytest-cov plugin"
test_globs: ["**/test_*.py", "**/*_test.py"]
source_globs: ["**/*.py"]
opaque: ["**/*.yaml", "**/*.yml", "**/*.sql", "**/*.html", "**/*.j2", "**/*.json", "**/fixtures/**"]
full_escalate: ["requirements.txt", "pyproject.toml", "setup.cfg", "pytest.ini", "tox.ini", "poetry.lock", "uv.lock", "**/conftest.py"]
