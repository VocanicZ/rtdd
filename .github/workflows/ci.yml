name: ci
on:
  pull_request:
  push:
    branches: [main]
  # #377: the workflow was switched off on 2026-08-26 and every commit of M6a-M6e
  # merged with no CI. A manual trigger means the next time it needs proving it can be
  # run on demand, without inventing a commit to push at it.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: test
        run: go test ./... -count=1

      - name: rtdd-gen check
        run: go run ./cmd/rtdd-gen check

      - name: rtdd-gen verify
        run: go run ./cmd/rtdd-gen verify

      - name: embedded protocol copy must match the source
        run: diff -u protocol/PROTOCOL.md internal/install/protocol.md

      - name: static binary
        run: |
          CGO_ENABLED=0 go build -o /tmp/rtdd ./cmd/rtdd
          file /tmp/rtdd
          file /tmp/rtdd | grep -q 'statically linked'

      # The step above proves the linux/amd64 host build is static. PRD #6 criterion 5
      # asks for all four released artifacts, so this cross-builds the whole
      # .goreleaser.yaml matrix and inspects each one by executable format. `go test ./...`
      # above runs it too; naming it here points a red build straight at the artifacts.
      - name: every release artifact is statically linked
        run: go test -count=1 -run '^TestReleaseArtifactsAreStaticallyLinked$' .

      # PRD #232 AC11: the shipped adapter set's two gates. `go test ./...` above runs
      # both; naming them points a red build at the adapter set. The `-list` line guards
      # each one because `go test -run` on a pattern matching nothing exits 0, so a
      # deleted or renamed gate would pass silently.
      - name: shipped-adapter completeness gate
        run: |
          listed="$(go test -list '^TestEveryShippedAdapterIsFullySpecified$' ./internal/contract/)"
          case "$listed" in
            *TestEveryShippedAdapterIsFullySpecified*) ;;
            *) echo "the shipped-adapter completeness gate is gone from ./internal/contract/"; exit 1 ;;
          esac
          go test -count=1 -run '^TestEveryShippedAdapterIsFullySpecified$' ./internal/contract/

      - name: shipped id_template round-trip
        run: |
          listed="$(go test -list 'RoundTrip' ./internal/report/)"
          case "$listed" in
            *RoundTrip*) ;;
            *) echo "./internal/report/ has no id round-trip test left"; exit 1 ;;
          esac
          go test -count=1 -run 'RoundTrip' ./internal/report/

      # Issue #334 AC2: the TS tier names test FILES and six shipped runners select by
      # test NAME. Without this gate the mismatch is a green run over zero executed tests.
      - name: TS selection matches each adapter's own subset selector
        run: |
          listed="$(go test -list '^TestEveryShippedAdapterSelectionMatchesItsSubsetSelector$' ./cmd/rtdd/)"
          case "$listed" in
            *TestEveryShippedAdapterSelectionMatchesItsSubsetSelector*) ;;
            *) echo "the selection/selector gate is gone from ./cmd/rtdd/"; exit 1 ;;
          esac
          go test -count=1 -run '^TestEveryShippedAdapterSelectionMatchesItsSubsetSelector$|^TestEveryStaticShippedAdapterHasASelectorCase$|^TestEveryStaticShippedAdapterDeclaresATestSelector$|^TestGoFixtureSelectionActuallyExecutesTestAdd$' ./cmd/rtdd/

      # PRD #368 AC11 (#380): the archives a release would publish, and install.sh
      # driven against them. Both tests below read build/dist, which .gitignore ignores —
      # on a clean checkout nothing fills it, so this step is what makes them mean
      # anything. It publishes NOTHING: --snapshot creates no tag, no release and no
      # draft, it re-runs no benchmark and it primes no cache. --skip=before because
      # .goreleaser.yaml's before hooks are `go mod tidy`, the two rtdd-gen commands and
      # `go test ./...`, each already its own step above.
      - name: release snapshot archives
        run: scripts/release-snapshot.sh --skip=before

      # The `-list` line guards each `-run` below: `go test -run` on a pattern matching
      # nothing exits 0, so a deleted or renamed gate would pass silently over zero tests.
      - name: release archives ship every shipped path
        run: |
          listed="$(go test -list '^TestGoreleaserSnapshotShipsEveryArchiveWithEveryShippedPath$' .)"
          case "$listed" in
            *TestGoreleaserSnapshotShipsEveryArchiveWithEveryShippedPath*) ;;
            *) echo "the release-archive contents gate is gone from the root package"; exit 1 ;;
          esac
          go test -count=1 -run '^TestGoreleaserSnapshotShipsEveryArchiveWithEveryShippedPath$' .

      - name: install.sh end to end against the real snapshot archives
        run: |
          listed="$(go test -list '^TestInstallFromRealSnapshotArchivesPinnedToTheBuildsOwnVersion$' .)"
          case "$listed" in
            *TestInstallFromRealSnapshotArchivesPinnedToTheBuildsOwnVersion*) ;;
            *) echo "the end-to-end install gate is gone from the root package"; exit 1 ;;
          esac
          go test -count=1 -run '^TestInstallFromRealSnapshotArchivesPinnedToTheBuildsOwnVersion$' .

  prereg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # #377: `bench replay suite` drives the SHIPPED binary through replay/rtddio.py,
      # which shells out to `rtdd` on PATH. A developer box has one installed and a bare
      # runner does not, so this step is what stopped the suite failing for want of a
      # tool rather than for a defect. The binary is built from this very checkout, so
      # the tool under test is the tree under test.
      - name: rtdd on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/rtdd" ./cmd/rtdd
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: prereg gate
        run: scripts/ci-prereg.sh

      # The arm-composition guarantee, named as its own step so a red build
      # points straight at it. ci-prereg.sh runs it too; this is the push gate.
      - name: arm-composition gate
        run: uv run pytest tests/test_prompts.py -q
        working-directory: bench/swebench

      # The acceptance gate for M4 Tasks 1-12: the shipped CLIs refusing, all five
      # refusal cases, the deliberately failing fixtures, and one fixture pass from
      # raw records to tables.md. ci-prereg.sh runs it too; this is the push gate.
      - name: acceptance gate
        run: uv run pytest tests/test_acceptance.py -q
        working-directory: bench/swebench

      # The same guarantee, checked against the prompts the arm driver actually
      # assembles — five arms over the whole frozen instance list, no model call
      # and no network. ci-prereg.sh runs it too; this is the push gate.
      - name: arm-driver dry run
        run: uv run python run_arm.py --dry-run
        working-directory: bench/swebench

      # #184: the corpus's admission criteria were prose nothing read, so a repo
      # 2.4x over its own budget sat in the frozen corpus through three published
      # results. This is what reads them. It exits non-zero on a breach.
      - name: corpus admission gate
        run: uv run python -m replay.cli audit
        working-directory: bench

      # #340: the whole replay suite, not three files of it. bench/replay/ now derives
      # the published static arm, so its tests are a push gate.
      - name: bench replay suite
        run: uv run pytest -q
        working-directory: bench
