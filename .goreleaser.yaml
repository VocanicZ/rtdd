# .goreleaser.yaml
version: 2

project_name: rtdd

# GoReleaser's default dist dir is ./dist, which collides with the tracked
# generated-front-end tree (dist/SKILL.md, dist/AGENTS.md, dist/cursor/) that
# `before.hooks` checks with rtdd-gen. GoReleaser cleans its dist dir before
# running hooks, so it would wipe those tracked files first. Keep them apart.
dist: build/dist

before:
  hooks:
    - go mod tidy
    - go run ./cmd/rtdd-gen check
    - go run ./cmd/rtdd-gen verify
    - go test ./...

builds:
  - id: rtdd
    main: ./cmd/rtdd
    binary: rtdd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}} -X main.date={{.CommitDate}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: rtdd
    ids: [rtdd]
    name_template: "rtdd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      # Both, because the two Windows install routes need different ones: install.ps1 uses
      # Expand-Archive (zip), while install.sh under Git Bash / MSYS2 / Cygwin has GNU tar
      # but not necessarily unzip. Publishing one would 404 the other route.
      - goos: windows
        formats: [zip, tar.gz]
    files:
      # Plan Task 20: the tarball ships the license and the README alongside the
      # generated front-ends. Without LICENSE the redistribution terms travel nowhere.
      - README.md
      - LICENSE
      - dist/SKILL.md
      - dist/AGENTS.md
      - dist/cursor/rules/rtdd.mdc
      # The machine-wide pair `rtdd skill install` writes into the user's home directory.
      - dist/GLOBAL-SKILL.md
      - dist/GLOBAL-AGENTS.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
