<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img">
<rect x="0" y="0" width="900" height="414" fill="#ffffff"/>
<text x="28.0" y="32.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">RTDD against running the whole suite</text>
<text x="28.0" y="52.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#656d76" text-anchor="start">The only comparison drawn here. Grey = run every test after every change. Blue = RTDD.</text>
<text x="28.0" y="80.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">The agent&#x27;s loop — 10 edits to one module, real flask clone</text>
<text x="28.0" y="92.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">486 tests in the suite, 16 selected · shorter is better</text>
<text x="28.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="start">full suite</text>
<rect x="146.0" y="115.0" width="560.0" height="12" rx="2" fill="#6e7781" data-strategy="full" data-metric="session_ms/full suite" data-value="28390 ms"/>
<text x="718.0" y="126.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">28390 ms   baseline</text>
<text x="28.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="start">rtdd run</text>
<rect x="146.0" y="145.0" width="393.8" height="12" rx="2" fill="#0969da" data-strategy="rtdd" data-metric="session_ms/rtdd run" data-value="19962 ms"/>
<text x="718.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">19962 ms   1.42× faster</text>
<text x="28.0" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="start">  --record=auto</text>
<rect x="146.0" y="175.0" width="199.8" height="12" rx="2" fill="#0969da" data-strategy="rtdd" data-metric="session_ms/--record=auto" data-value="10127 ms"/>
<text x="718.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">10127 ms   2.80× faster</text>
<text x="28.0" y="222.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">What it catches, against what a full run catches</text>
<text x="28.0" y="234.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">flask, paired population, 5 detecting commits · taller is better, except the last row</text>
<text x="28.0" y="270.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="start">caught the change</text>
<rect x="146.0" y="256.0" width="560.0" height="9" rx="2" fill="#6e7781" data-strategy="full" data-metric="change_level_recall" data-value="1.000"/>
<text x="718.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">full  1.000 (5/5)</text>
<rect x="146.0" y="268.0" width="560.0" height="9" rx="2" fill="#0969da" data-strategy="rtdd" data-metric="change_level_recall" data-value="1.000"/>
<text x="718.0" y="276.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">rtdd  1.000 (5/5)</text>
<text x="28.0" y="306.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="start">…where one test fails</text>
<rect x="146.0" y="292.0" width="560.0" height="9" rx="2" fill="#6e7781" data-strategy="full" data-metric="strata/1/change_level_recall" data-value="1.000"/>
<text x="718.0" y="300.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">full  1.000 (4/4)</text>
<rect x="146.0" y="304.0" width="560.0" height="9" rx="2" fill="#0969da" data-strategy="rtdd" data-metric="strata/1/change_level_recall" data-value="1.000"/>
<text x="718.0" y="312.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">rtdd  1.000 (4/4)</text>
<text x="28.0" y="342.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1f2328" text-anchor="start">share of suite time</text>
<rect x="146.0" y="328.0" width="560.0" height="9" rx="2" fill="#6e7781" data-strategy="full" data-metric="selected_duration_fraction" data-value="1.000"/>
<text x="718.0" y="336.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">full  1.000</text>
<rect x="146.0" y="340.0" width="424.1" height="9" rx="2" fill="#0969da" data-strategy="rtdd" data-metric="selected_duration_fraction" data-value="0.757"/>
<text x="718.0" y="348.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="normal" fill="#656d76" text-anchor="start">rtdd  0.757</text>
<text x="28.0" y="368.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">source: bench/results/paired/flask/summary.json · bench/results/agent-session/flask.json</text>
<text x="28.0" y="384.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Parity is the ceiling, not a tie broken in RTDD&#x27;s favour: a full run catches what it catches by definition.</text>
<text x="28.0" y="397.0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#656d76" text-anchor="start">Five detecting commits, one repository, and `probe` seeds the map at the child commit — an upper bound, not a general result.</text>
</svg>
