# The Java (Maven) adapter on contract v3: one test class per process (-Dtest={name}), all
# through plugin goals on the command line so the host pom needs no change. jobs: 1
# because every unit shares target/.
#
# JaCoCo: prepare-agent attaches the agent, writing {tmp}/jacoco.exec. The jacoco-maven
# plugin's report goal cannot be pointed at {tmp} (its outputDirectory has no user
# property), so the report is made by the JaCoCo CLI instead: dependency:copy fetches
# org.jacoco.cli into {tmp}, and exec:exec runs it from an @argfile shipped through
# unit_files (unit_cmd is whitespace-split, so a multi-word -Dexec.args cannot be one
# token). It reads target/classes, Maven's default output dir. Verified on maven 3.9 with
# java 25 against the maven fixture.
name: maven
detect: ["pom.xml"]
unit_cmd: "mvn -q -Dtest={name} -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.destFile={tmp}/jacoco.exec org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent test org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy -Dartifact=org.jacoco:org.jacoco.cli:0.8.13:jar:nodeps -DoutputDirectory={tmp} org.codehaus.mojo:exec-maven-plugin:3.5.0:exec -Dexec.executable=java -Dexec.args=@{tmp}/jacoco.args"
unit_files:
  jacoco.args: "-jar {tmp}/org.jacoco.cli-0.8.13-nodeps.jar report {tmp}/jacoco.exec --classfiles target/classes --xml {tmp}/jacoco.xml"
coverage_file: "{tmp}/jacoco.xml"
coverage_format: jacoco
jobs: 1
requires:
  - bin: mvn
    reason: "the maven adapter runs mvn (JaCoCo and its CLI are fetched by Maven, so the first run needs network)"
test_globs: ["src/test/java/**/*.java", "src/test/kotlin/**/*.kt"]
source_globs: ["src/main/java/**/*.java", "src/main/kotlin/**/*.kt", "src/test/java/**/*.java"]
opaque: ["src/main/resources/**", "src/test/resources/**", "**/*.xml", "**/*.properties"]
full_escalate: ["pom.xml", "**/pom.xml", ".mvn/wrapper/maven-wrapper.properties", "src/test/resources/**"]
