# The Java (Maven) adapter on contract v3: one test class per process (-Dtest={name}),
# JaCoCo attached and reported through plugin goals on the command line, so the pom
# needs no change. jobs: 1 because every unit shares target/.
# unverified — settled in Task 10.
name: maven
detect: ["pom.xml"]
unit_cmd: "mvn -q -Dtest={name} -Djacoco.destFile={tmp}/jacoco.exec org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.13:report -Djacoco.dataFile={tmp}/jacoco.exec -Djacoco.outputDirectory={tmp}/site"
coverage_file: "{tmp}/site/jacoco.xml"
coverage_format: jacoco
jobs: 1
requires:
  - bin: mvn
    reason: "the maven adapter runs mvn with the JaCoCo plugin"
test_globs: ["src/test/java/**/*.java", "src/test/kotlin/**/*.kt"]
source_globs: ["src/main/java/**/*.java", "src/main/kotlin/**/*.kt", "src/test/java/**/*.java"]
opaque: ["src/main/resources/**", "src/test/resources/**", "**/*.xml", "**/*.properties"]
full_escalate: ["pom.xml", "**/pom.xml", ".mvn/wrapper/maven-wrapper.properties", "src/test/resources/**"]
