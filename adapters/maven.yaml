# The Java (Maven / Surefire) adapter.
#
# Surefire writes one JUnit XML per test class into target/surefire-reports/, so
# `report_path` is a DIRECTORY — it ends in "/" and the runner reads every report under
# it. Gradle is the other adapter of that shape; the other seven name a single file.
#
# `test_join` is DECISION 8: `-Dtest=` takes ONE value holding every selector, comma
# separated, so {tests} is substituted INSIDE the token rather than spliced as bare argv
# elements. -DfailIfNoSpecifiedTests=false keeps a chunk whose classes live in another
# module from failing the build instead of selecting nothing.
#
# The id is CASE-granular and `{classname}#{name}` is exactly Surefire's own
# Class#method syntax. That is the REPORTING vocabulary; `test_selector` is the SELECTION
# one (DECISION 13). The TS tier names src/test/java/calc/CalcTest.java, and `-Dtest=` takes
# a class, not a path — so the selector is the file's base name, which for a Java test file
# IS the simple class name Surefire accepts. Splicing the path instead selects nothing, and
# -DfailIfNoSpecifiedTests=false then keeps the build green over zero executed tests (#334).
#
# `test_for` uses {subdir}, not {dir}: the changed file's directory is
# src/main/java/<package>, and the test that corresponds to it lives at
# src/test/java/<package> — the mirrored part is the PACKAGE, and how many leading
# segments the source root occupies is a property of the repository (a module under
# services/api/ moves it). {subdir} is {dir} or any trailing part of it, longest first,
# and a candidate still counts only when the file exists.
name: maven
detect: ["pom.xml"]
selection: static
coverage: none
subset: "mvn -B test -Dtest={tests} -DfailIfNoSpecifiedTests=false"
test_join: ","
test_selector: "{name}"
list: "mvn -B test"
report: junit-xml
report_path: "target/surefire-reports/"
id_template: "{classname}#{name}"
failfast_flag: "-ff"
test_for: ["src/test/java/{subdir}/{name}Test.java", "src/test/java/{subdir}/{name}Tests.java", "src/test/kotlin/{subdir}/{name}Test.kt"]
test_globs: ["src/test/java/**/*.java", "src/test/kotlin/**/*.kt"]
source_globs: ["src/main/java/**/*.java", "src/main/kotlin/**/*.kt", "src/test/java/**/*.java"]
opaque: ["src/main/resources/**", "src/test/resources/**", "**/*.xml", "**/*.properties"]
full_escalate: ["pom.xml", "**/pom.xml", ".mvn/wrapper/maven-wrapper.properties", "src/test/resources/**"]
