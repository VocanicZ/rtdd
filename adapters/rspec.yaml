# The Ruby (RSpec) adapter on contract v3: one spec file per process, simplecov-lcov output.
# The loader below is shipped through unit_files and preloaded with RUBYOPT, so the project's
# spec_helper needs no change; the Gemfile must include simplecov and simplecov-lcov.
# bundler/setup runs first so those gems resolve before the loader requires them.
# NOT RUN against a real toolchain in this change (ruby and bundle absent here).
# A first real run must confirm: RUBYOPT survives `bundle exec` and SimpleCov starts once in
# the rspec process, lcov.info lands in {tmp} with repo-relative paths, and a run with no
# examples exits with a code worth listing in exit_codes (none is listed now).
name: rspec
detect: [".rspec", "spec/spec_helper.rb"]
unit_cmd: "bundle exec rspec {unit}"
unit_files:
  rtdd_simplecov.rb: |
    require "bundler/setup"
    require "simplecov"
    require "simplecov-lcov"
    SimpleCov::Formatter::LcovFormatter.config do |c|
      c.report_with_single_file = true
      c.single_report_path = "{tmp}/lcov.info"
    end
    SimpleCov.formatter = SimpleCov::Formatter::LcovFormatter
    SimpleCov.coverage_dir("{tmp}/simplecov")
    SimpleCov.start
env: { RUBYOPT: "-r{tmp}/rtdd_simplecov.rb" }
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
requires:
  - bin: bundle
    reason: "the rspec adapter runs bundle exec rspec; simplecov and simplecov-lcov must be in the Gemfile"
test_globs: ["spec/**/*_spec.rb"]
source_globs: ["lib/**/*.rb", "app/**/*.rb", "spec/**/*.rb"]
opaque: ["spec/fixtures/**", "**/*.yml", "**/*.erb", "**/*.json"]
full_escalate: ["Gemfile", "Gemfile.lock", ".rspec", "spec/spec_helper.rb", "spec/rails_helper.rb", "*.gemspec"]
