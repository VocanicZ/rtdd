# The Ruby (RSpec) adapter on contract v3: one spec file per process, simplecov-lcov output.
# The project's spec_helper must start SimpleCov with the lcov formatter writing
# $RTDD_COVERAGE_DIR/lcov.info.
# unverified — settled in Task 12.
name: rspec
detect: [".rspec", "spec/spec_helper.rb"]
unit_cmd: "bundle exec rspec {unit}"
env: { RTDD_COVERAGE_DIR: "{tmp}" }
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
requires:
  - bin: bundle
    reason: "the rspec adapter runs bundle exec rspec; simplecov and simplecov-lcov must be in the Gemfile"
test_globs: ["spec/**/*_spec.rb"]
source_globs: ["lib/**/*.rb", "app/**/*.rb", "spec/**/*.rb"]
opaque: ["spec/fixtures/**", "**/*.yml", "**/*.erb", "**/*.json"]
full_escalate: ["Gemfile", "Gemfile.lock", ".rspec", "spec/spec_helper.rb", "spec/rails_helper.rb", "*.gemspec"]
