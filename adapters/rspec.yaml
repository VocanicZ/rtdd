# The Ruby (RSpec) adapter on contract v3: one spec file per process, simplecov-lcov output.
# The loader below is shipped through unit_files and passed as `--require`, so it runs inside
# the bundle (simplecov resolves through the Gemfile, which must include simplecov and
# simplecov-lcov) and the project's spec_helper needs no change.
# Tradeoff: .rspec's `--require spec_helper` loads first, so app code a spec_helper loads
# before SimpleCov.start is not attributed, and a project that already starts SimpleCov in
# its spec_helper starts it twice.
# The lcov path uses simplecov-lcov's documented output_directory + lcov_file_name (with
# report_with_single_file), so it cannot be re-joined under coverage/.
# NOT RUN against a real toolchain in this change (ruby and bundle absent here).
# A first real run must confirm: SimpleCov starts once in the rspec process, lcov lands at
# {tmp}/lcov.info with repo-relative paths, and a run with no examples exits with a code
# worth listing in exit_codes (none is listed now).
name: rspec
detect: [".rspec", "spec/spec_helper.rb"]
unit_cmd: "bundle exec rspec --require {tmp}/rtdd_simplecov.rb {unit}"
unit_files:
  rtdd_simplecov.rb: |
    require "simplecov"
    require "simplecov-lcov"
    SimpleCov::Formatter::LcovFormatter.config do |c|
      c.report_with_single_file = true
      c.output_directory = "{tmp}"
      c.lcov_file_name = "lcov.info"
    end
    SimpleCov.formatter = SimpleCov::Formatter::LcovFormatter
    SimpleCov.coverage_dir("{tmp}/simplecov")
    SimpleCov.start
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
requires:
  - bin: bundle
    reason: "the rspec adapter runs bundle exec rspec; simplecov and simplecov-lcov must be in the Gemfile"
test_globs: ["spec/**/*_spec.rb"]
source_globs: ["lib/**/*.rb", "app/**/*.rb", "spec/**/*.rb"]
opaque: ["spec/fixtures/**", "**/*.yml", "**/*.erb", "**/*.json"]
full_escalate: ["Gemfile", "Gemfile.lock", ".rspec", "spec/spec_helper.rb", "spec/rails_helper.rb", "*.gemspec"]
