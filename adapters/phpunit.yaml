# The PHP (PHPUnit) adapter on contract v3: one test file per process, cobertura coverage.
# PHPUnit records coverage only with the pcov or xdebug extension loaded.
# unverified — settled in Task 12.
name: phpunit
detect: ["phpunit.xml", "phpunit.xml.dist", "phpunit.dist.xml"]
unit_cmd: "vendor/bin/phpunit --coverage-cobertura {tmp}/cobertura.xml {unit}"
coverage_file: "{tmp}/cobertura.xml"
coverage_format: cobertura
requires:
  - bin: php
    reason: "phpunit records coverage only with the pcov or xdebug extension loaded"
test_globs: ["tests/**/*Test.php"]
source_globs: ["src/**/*.php", "lib/**/*.php", "tests/**/*.php"]
opaque: ["**/*.json", "**/*.xml", "**/*.twig", "tests/fixtures/**"]
full_escalate: ["composer.json", "composer.lock", "phpunit.xml", "phpunit.xml.dist", "phpunit.dist.xml", "tests/bootstrap.php"]
