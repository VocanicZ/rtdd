# The .NET adapter on contract v3: one test class per process via --filter, coverage from
# the coverlet collector ("XPlat Code Coverage"). jobs: 1 because every unit shares bin/ obj/.
# unverified — settled in Task 11 (coverlet writes {tmp}/<guid>/coverage.cobertura.xml;
# coverage_file needs one * glob segment). The collector is named by URI because
# "XPlat Code Coverage" holds spaces and unit_cmd is split on whitespace.
name: dotnet
detect: ["*.sln", "*.csproj", "*.fsproj"]
unit_cmd: "dotnet test --collect datacollector://Microsoft/CoverletCodeCoverage/1.0 --results-directory {tmp} --filter FullyQualifiedName~{name}"
coverage_file: "{tmp}/*/coverage.cobertura.xml"
coverage_format: cobertura
jobs: 1
requires:
  - bin: dotnet
    reason: "the dotnet adapter runs dotnet test with the coverlet.collector package referenced by the test project"
test_globs: ["**/*Tests.cs", "**/*Test.cs", "tests/**/*.cs", "test/**/*.cs"]
source_globs: ["**/*.cs", "**/*.fs"]
opaque: ["**/*.json", "**/*.resx", "**/*.xml", "**/TestData/**"]
full_escalate: ["*.sln", "**/*.csproj", "**/*.fsproj", "Directory.Build.props", "Directory.Packages.props", "nuget.config", "global.json"]
