# The Java/Kotlin (Gradle) adapter on contract v3: one test class per process
# (--tests *{name}), JaCoCo applied by an init script that unit_files writes into the
# unit's {tmp}, so the host build needs no change. jobs: 1 because every unit shares build/.
#
# NOT VERIFIED ON A REAL TOOLCHAIN in the change that introduced it: gradle was not
# installed where it was written. The init script follows Gradle's documented jacoco
# plugin API; expect to adjust it on first real use. It reports per project, so a
# multi-project build would have the last project's report win {tmp}/jacoco.xml, and
# --tests fails a subproject that has no matching class (add failOnNoMatchingTests=false
# via the init script if that bites). `--tests {name}` (no package) matches the simple
# class name per the Gradle test-filtering docs, so ApiTest does not select FooApiTest;
# from memory of those docs, unconfirmed here. {name} cannot carry a package.
name: gradle
detect: ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]
unit_cmd: "./gradlew -q --init-script {tmp}/rtdd.init.gradle test --tests {name}"
unit_files:
  rtdd.init.gradle: |
    allprojects {
      plugins.withId('java') {
        apply plugin: 'jacoco'
        tasks.withType(Test).configureEach {
          jacoco { destinationFile = file('{tmp}/jacoco.exec') }
          finalizedBy tasks.named('jacocoTestReport')
        }
        tasks.named('jacocoTestReport') {
          executionData.setFrom(file('{tmp}/jacoco.exec'))
          reports {
            xml.required = true
            xml.outputLocation = file('{tmp}/jacoco.xml')
          }
        }
      }
    }
coverage_file: "{tmp}/jacoco.xml"
coverage_format: jacoco
jobs: 1
test_globs: ["src/test/java/**/*.java", "src/test/kotlin/**/*.kt"]
source_globs: ["src/main/java/**/*.java", "src/main/kotlin/**/*.kt", "src/test/java/**/*.java", "src/test/kotlin/**/*.kt"]
opaque: ["src/main/resources/**", "src/test/resources/**", "**/*.properties", "**/*.xml"]
full_escalate: ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts", "gradle.properties", "gradle/libs.versions.toml", "gradle/wrapper/gradle-wrapper.properties"]
