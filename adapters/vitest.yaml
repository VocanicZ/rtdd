# The Vitest adapter on contract v3: one test file per process, @vitest/coverage-v8 lcov.
# `detect` does not list package.json; a repo configuring Vitest inside vite.config.ts
# detects nothing and needs a host adapter in .rtdd/adapters/.
# Verified against vitest 5. test_globs are only *.test.* / *.spec.* files: vitest exits 1 ("No test
# files found") on a file its include skips, so helpers under test/ or tests/ must not become units (the former test/** and tests/** globs
# were removed). Covers vitest's default include: js, jsx, ts, tsx, mjs, cjs, mts, cts.
# The --coverage.thresholds.*=0 flags zero a project's global thresholds: one file alone never
# meets a suite-wide threshold. Glob-keyed thresholds in the config are not overridden.
# Cost: vitest filters by substring, so a unit also runs every test file whose path contains
# it (src/x/src/api.test.ts for src/api.test.ts); that unit's row then records both files' coverage.
name: vitest
detect: ["vitest.config.js", "vitest.config.ts", "vitest.config.mjs", "vitest.config.mts", "vitest.config.cjs", "vitest.workspace.ts"]
unit_cmd: "npx vitest run --coverage.enabled --coverage.reporter=lcov --coverage.reportsDirectory={tmp} --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0 {unit}"
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
requires:
  - bin: npx
    reason: "the vitest adapter runs vitest through npx; vitest and @vitest/coverage-v8 must be devDependencies"
test_globs: ["**/*.test.js", "**/*.test.jsx", "**/*.test.ts", "**/*.test.tsx", "**/*.test.mjs", "**/*.test.cjs", "**/*.test.mts", "**/*.test.cts", "**/*.spec.js", "**/*.spec.jsx", "**/*.spec.ts", "**/*.spec.tsx", "**/*.spec.mjs", "**/*.spec.cjs", "**/*.spec.mts", "**/*.spec.cts"]
source_globs: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs"]
opaque: ["**/*.json", "**/*.css", "**/*.html", "**/*.snap", "**/fixtures/**"]
full_escalate: ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "vitest.config.js", "vitest.config.ts", "vitest.config.mjs", "vitest.config.mts", "vitest.config.cjs", "vitest.workspace.ts", "tsconfig.json", "**/setupTests.ts"]
