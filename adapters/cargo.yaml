# The Rust adapter on contract v3: one integration test file (tests/{name}.rs) per
# process under cargo-llvm-cov. Unit tests inside src/ (#[cfg(test)]) are never units: "a
# .rs file holding #[cfg(test)]" is not expressible as a glob, so only tests/*.rs ship.
# Workspace members' tests (crates/*/tests/*.rs) are units too: `--test {name}` from the
# root runs that member's target (verified, cargo-llvm-cov). Two members with a test file
# of the same name both run for either unit (over-selection). A src/**/tests/*.rs module
# file also matches and errors as a unit (no such test target).
# jobs: 1 because every unit shares target/.
name: cargo
detect: ["Cargo.toml"]
unit_cmd: "cargo llvm-cov --lcov --output-path {tmp}/lcov.info --test {name}"
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
jobs: 1
requires:
  - bin: cargo-llvm-cov
    reason: "the cargo adapter records coverage with cargo llvm-cov (cargo install cargo-llvm-cov)"
test_globs: ["**/tests/*.rs"]
source_globs: ["**/src/**/*.rs", "**/tests/**/*.rs", "**/benches/**/*.rs"]
opaque: ["**/*.toml", "**/*.json", "**/testdata/**", "**/snapshots/**"]
full_escalate: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "build.rs"]
