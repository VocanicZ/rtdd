# The Jest adapter on contract v3: one test file per process, jest's own lcov reporter.
# `detect` does not list package.json; a repo configuring Jest under a "jest" key in
# package.json detects nothing and needs a host adapter in .rtdd/adapters/.
# Verified against jest 30. test_globs are only *.test.* / *.spec.* files: jest exits 1 ("No tests
# found") on a file its testMatch skips, so __tests__/ helpers must not become units.
# Cost: projects keeping tests only in __tests__/ under non-.test names need a host adapter
# (.rtdd/adapters/jest.yaml). Extensions are js/jsx/ts/tsx only: jest's default testMatch does not
# run .mjs/.cjs/.mts/.cts tests, so listing them would make units jest skips (exit 1).
name: jest
detect: ["jest.config.js", "jest.config.ts", "jest.config.mjs", "jest.config.cjs", "jest.config.json"]
unit_cmd: "npx jest --ci --coverage --coverageReporters=lcovonly --coverageDirectory={tmp} {unit}"
coverage_file: "{tmp}/lcov.info"
coverage_format: lcov
requires:
  - bin: npx
    reason: "the jest adapter runs jest through npx; jest must be a devDependency"
test_globs: ["**/*.test.js", "**/*.test.jsx", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.js", "**/*.spec.jsx", "**/*.spec.ts", "**/*.spec.tsx"]
source_globs: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs"]
opaque: ["**/*.json", "**/*.css", "**/*.html", "**/*.snap", "**/__snapshots__/**", "**/fixtures/**"]
full_escalate: ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "jest.config.js", "jest.config.ts", "jest.config.mjs", "jest.config.cjs", "jest.config.json", "jest.setup.js", "babel.config.js", "tsconfig.json"]
